<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Blowout Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --panel: #0b0b0c;
    --panel-2: #131316;
    --panel-3: #1a1a1e;
    --border: #202024;
    --border-strong: #2e2e34;
    --text: #fff;
    --muted: rgba(255,255,255,0.55);
    --muted-2: rgba(255,255,255,0.34);
    --amber: #fbbf24;
    --emerald: #34d399;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 1200px;
    padding: 0 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .masthead {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .masthead h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .masthead .sub { font-size: 12px; color: var(--muted-2); margin-top: 2px; }
  .head-right { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,.16); }
  .dot.sleep { background: var(--amber); box-shadow: 0 0 0 3px rgba(251,191,36,.16); }
  .dot.stale { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.16); }

  /* ---------- Bot state banner ---------- */
  .botstate {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 16px 0 0; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--green); border-radius: 8px;
  }
  .botstate.sleeping { border-left-color: var(--amber); }
  .botstate .bs-main { font-size: 13px; font-weight: 600; }
  .botstate .bs-note { font-size: 12px; color: var(--muted); }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; background: var(--panel-3); color: var(--muted);
    border: 1px solid var(--border); white-space: nowrap;
  }
  .tag.on { background: rgba(34,197,94,.14); color: var(--green); border-color: rgba(34,197,94,.35); }
  .tag.warn { background: rgba(251,191,36,.14); color: var(--amber); border-color: rgba(251,191,36,.35); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin: 20px 0 12px;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    appearance: none; cursor: pointer; font-family: var(--font);
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill:hover { color: var(--text); border-color: var(--border-strong); }
  .pill.active { background: #fff; color: #000; border-color: #fff; }
  .pill .n { font-size: 10px; font-weight: 700; opacity: .65; font-family: var(--mono); }
  .selwrap { display: flex; align-items: center; gap: 8px; }
  .selwrap label { font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  select {
    appearance: none; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font); font-size: 12px; font-weight: 600;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; outline: none;
  }
  select option { background: #16161a; }

  /* ---------- Section band ---------- */
  .band {
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding: 10px 14px; background: var(--panel-2);
    border: 1px solid var(--border); border-bottom: 0;
    border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .band .band-note { font-weight: 600; letter-spacing: .04em; color: var(--muted-2); text-transform: none; font-size: 11px; }
  .boxed { border: 1px solid var(--border); border-radius: 0 0 8px 8px; background: var(--panel); overflow: hidden; }
  .section { margin-top: 22px; }

  /* ---------- Slate rows ---------- */
  .slate-row {
    display: grid;
    grid-template-columns: 8px minmax(140px,1.4fr) 60px 84px 1fr auto;
    align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; background: transparent;
  }
  .slate-row:last-child { border-bottom: 0; }
  .slate-row:hover { background: var(--panel-2); }
  .slate-row.sel { background: var(--panel-3); }
  .slate-row:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .slate-row .flag { width: 4px; height: 30px; border-radius: 2px; background: transparent; }
  .slate-row.urgent .flag { background: var(--red); }
  .slate-row.big .flag { background: var(--amber); }
  .sr-teams { font-size: 13px; font-weight: 600; line-height: 1.35; min-width: 0; }
  .sr-teams .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-teams .t.dim { color: var(--muted); }
  .sr-logo { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; }
  /* Desktop content sits above the fixed ambient field. */
  #desk-root { position: relative; z-index: 1; }
  .sr-teams .m-lw { margin-right: 6px; vertical-align: -3px; }
  .slate-row.upcoming { opacity: .78; }
  .slate-row.upcoming .flag { background: transparent; }
  .sr-score { font-family: var(--mono); font-size: 15px; font-weight: 700; line-height: 1.35; text-align: right; }
  .sr-score .lose { color: var(--muted-2); }
  .sr-inning { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; line-height: 1.35; }
  .sr-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chipnum {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; background: var(--panel-3);
    color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .chipnum.hot { background: rgba(239,68,68,.14); color: var(--red); border-color: rgba(239,68,68,.32); }
  .chipnum.warm { background: rgba(251,191,36,.14); color: var(--amber); border-color: rgba(251,191,36,.32); }
  .pen-dots { display: inline-flex; gap: 2px; align-items: center; }
  .pd { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .pd.on { background: var(--amber); }
  @media (max-width: 720px) {
    .slate-row { grid-template-columns: 6px 1fr 52px; row-gap: 6px; }
    .slate-row .sr-inning:last-child { display: none; }
    .sr-meta { grid-column: 2 / -1; }
    .slate-row > .sr-inning:nth-of-type(1) { grid-column: 2 / -1; }
  }

  /* ---------- Detail: matchup header ---------- */
  .matchup {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 14px; padding: 18px 16px; border-bottom: 1px solid var(--border);
  }
  .mt { min-width: 0; }
  .mt.right { text-align: right; }
  .mt .name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .mt .sub { font-size: 10px; color: var(--muted-2); margin-top: 3px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .mt .runs { font-family: var(--mono); font-size: 34px; font-weight: 800; line-height: 1; margin-top: 6px; }
  .mt .runs.lose { color: var(--muted-2); }
  .mid { text-align: center; }
  .mid .vs { font-size: 10px; color: var(--muted-2); font-weight: 700; letter-spacing: .12em; }
  .mid .state { font-size: 13px; font-weight: 700; margin-top: 4px; white-space: nowrap; }
  .mid .count { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    appearance: none; background: transparent; border: 0; cursor: pointer;
    font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 11px 16px; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--amber); }

  /* ---------- Two-sided comparison row ---------- */
  .cmp {
    display: grid; grid-template-columns: 1fr minmax(110px,auto) 1fr;
    align-items: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid var(--border);
  }
  .cmp:last-child { border-bottom: 0; }
  .cmp .v { font-family: var(--mono); font-size: 14px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp .v.a { text-align: right; }
  .cmp .v.b { text-align: left; }
  .cmp .v.dim { color: var(--muted-2); font-weight: 500; }
  .cmp .v .rk { font-size: 10px; font-weight: 700; color: var(--muted-2); margin-left: 4px; font-family: var(--font); }
  .cmp .lbl {
    text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted-2);
  }
  .cmp .v.hi { color: var(--emerald); }
  .cmp .v.hot { color: var(--red); }
  .cmp .v.warm { color: var(--amber); }

  /* ---------- Ladder / bullpen columns ---------- */
  .duo { display: grid; grid-template-columns: 1fr 1fr; }
  .duo > div { padding: 14px 16px; min-width: 0; }
  .duo > div:first-child { border-right: 1px solid var(--border); }
  @media (max-width: 640px) {
    .duo { grid-template-columns: 1fr; }
    .duo > div:first-child { border-right: 0; border-bottom: 1px solid var(--border); }
  }
  .colhead {
    font-size: 12px; font-weight: 700; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .colhead .tiny { font-size: 10px; color: var(--muted-2); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
  .lrow, .brow {
    display: grid; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 12px; padding: 4px 0;
  }
  .lrow { grid-template-columns: 1fr auto; }
  .lrow .pt { font-weight: 700; }
  .lrow .pr { color: var(--muted); }
  .brow { grid-template-columns: 14px 1fr auto; }
  .brow .i { font-size: 10px; color: var(--muted-2); text-align: right; }
  .brow .nm { font-family: var(--font); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .st { font-size: 11px; color: var(--muted-2); white-space: nowrap; }
  .brow.cur .nm { color: var(--amber); font-weight: 700; }
  .brow.cur .nm::after { content: " \25CF"; color: var(--green); font-size: 9px; }
  .nodata { font-size: 12px; color: var(--muted-2); font-style: italic; padding: 6px 0; }

  /* ---------- Alerts ---------- */
  .alert {
    padding: 13px 16px; border-bottom: 1px solid var(--border);
  }
  .alert:last-child { border-bottom: 0; }
  .alert .a-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 5px; }
  .alert .a-score { font-size: 14px; font-weight: 700; }
  .alert .a-time { font-size: 11px; color: var(--muted-2); font-family: var(--mono); margin-left: auto; }
  .alert .a-body { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .alert .a-body b { color: var(--text); }
  .alert .a-line { font-family: var(--mono); font-size: 11px; color: var(--muted-2); margin-top: 5px; }

  /* ---------- Footer ---------- */
  .stats { display: flex; flex-wrap: wrap; gap: 22px; padding: 16px; }
  .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-2); font-weight: 700; margin-bottom: 4px; }
  .stat .v { font-size: 17px; font-weight: 700; font-family: var(--mono); }
  .empty { padding: 34px 16px; text-align: center; color: var(--muted-2); font-size: 13px; }

/* ==========================================================================
   MOBILE — "Nocturne" design handoff. Separate information architecture,
   same fetch and same derived values as desktop; only DOM composition differs.
   Active under 700px via body.mobile (set in JS, re-evaluated on resize).
   ========================================================================== */
  :root {
    /* Black ground. Surfaces are near-black neutrals so the only real color on
       the page comes from the team halos and the ambient wash. */
    --n-ground:#000; --n-surf:#0b0b0d; --n-raised:#141417; --n-armed:#121215;
    --n-nav:#08080a; --n-navact:#1c1c21;
    --n-tx:#f2f2f4; --n-tx2:#b9bac0; --n-tx3:#9a9ba3; --n-tx4:#75767e; --n-tx5:#565760;
    --n-bd:#1c1c20; --n-bd2:#242429; --n-bd3:#2e2e34; --n-bd4:#3a3a41;
    --n-ac:#9184d9; --n-ac300:#d2cefd; --n-ac400:#b5abfc; --n-ac600:#796cbf;
    --n-ac700:#5d5294; --n-ac800:#423a6a; --n-ac900:#1e1a2b; --n-actint:#1a1a1f;
    --n-good:oklch(0.72 0.10 152); --n-bad:oklch(0.65 0.13 26);
    --n-badmute:#5c4a4a; --n-warn:oklch(0.78 0.11 78);
    --n-signal:#131316;
  }
  body.mobile { max-width:none; padding:0; background:var(--n-ground); color:var(--n-tx);
    font-variant-numeric: tabular-nums; font-size:14px; line-height:1.5; }

  /* ---------- Ambient wash ----------
     A fixed, very low-alpha color field behind everything. Sits below content
     and never scrolls, so the page reads as black with soft color pooling at
     the edges rather than a flat void. The two hues are set from JS to match
     what the slate is actually doing (urgency runs warm/red, a big lead runs
     amber, an ordinary slate stays cool). */
  .amb {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(90% 55% at 8% -8%,  var(--amb1, rgba(120,110,190,.16)) 0%, transparent 62%),
      radial-gradient(85% 50% at 98% 8%,  var(--amb2, rgba(60,120,190,.10)) 0%, transparent 60%),
      radial-gradient(120% 60% at 50% 108%, var(--amb3, rgba(90,90,150,.12)) 0%, transparent 66%);
    transition: background 1.2s ease;
  }
  body.mobile #m-root { position:relative; z-index:1; }
  body.mobile .m-tab { z-index:5; }

  /* ---------- Team-color halo behind each logo ---------- */
  .m-lw { position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .m-lw::before {
    content:''; position:absolute; left:50%; top:50%;
    width:190%; height:190%; transform:translate(-50%,-50%);
    border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, var(--tc, transparent) 0%, transparent 66%);
    opacity:.30; filter:blur(4px);
  }
  .m-lw img, .m-lw span { position:relative; z-index:1; }
  /* Bigger, warmer halo on the game boxes where the logo is the focal point */
  .m-box2 .m-lw::before { width:215%; height:215%; opacity:.36; filter:blur(5px); }
  .m-box2.final .m-lw::before { opacity:.16; }
  body.mobile #desk-root { display:none; }
  body.mobile #m-root { display:block; }
  body:not(.mobile) #m-root { display:none !important; }
  #m-root { padding-bottom:96px; }
  #m-screen { position:relative; }

  @keyframes bbPulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  @keyframes bbSweep { 0%{transform:translateY(-4px);opacity:0} 10%{opacity:1} 100%{transform:translateY(700px);opacity:0} }
  @keyframes bbIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
  .m-sweep { position:fixed; left:0; right:0; top:0; height:2px; z-index:6; pointer-events:none;
    background:linear-gradient(90deg,rgba(145,132,217,0),#9184d9,rgba(145,132,217,0));
    animation:bbSweep 1.1s linear; }
  .bbin { animation:bbIn .18s ease-out; }

  .m-tap { cursor:pointer; }
  .m-tap:active { opacity:.6; }
  #m-root :focus-visible { outline:2px solid var(--n-ac); outline-offset:2px; }

  /* Bottom tab bar */
  .m-tab { position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; gap:2px; padding:7px 8px calc(30px + env(safe-area-inset-bottom, 0px));
    background:var(--n-nav); border-top:1px solid #262838; }
  .m-tab button { flex:1; appearance:none; background:transparent; border:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:7px 0 5px; border-radius:9px; color:var(--n-tx4);
    font-family:var(--font); font-size:9.5px; letter-spacing:.04em; min-height:44px; }
  .m-tab button.on { background:var(--n-navact); color:var(--n-ac300); }
  .m-tab svg { width:18px; height:18px; fill:none; stroke:currentColor;
    stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }

  /* List header */
  .m-head { padding:0 18px 10px; background:linear-gradient(180deg,rgba(255,255,255,.045) 0%,rgba(0,0,0,0) 100%); }
  .m-head .r1 { height:26px; display:flex; align-items:center; justify-content:space-between; }
  .m-mark { display:flex; align-items:center; gap:7px; }
  .m-markbox { width:15px; height:15px; border:1px solid var(--n-ac); border-radius:4px;
    display:flex; align-items:center; justify-content:center; }
  .m-markdot { width:5px; height:5px; border-radius:50%; background:var(--n-good);
    animation:bbPulse 2s ease-in-out infinite; }
  .m-markdot.asleep { background:var(--n-tx4); animation:none; }
  .m-wordmark { font-size:10.5px; font-weight:500; letter-spacing:.15em; color:var(--n-tx2); }
  .m-fresh { font-size:10px; letter-spacing:.05em; color:var(--n-tx4); }
  .m-fresh.stale { color:var(--n-warn); }
  .m-refresh { width:26px; height:26px; border:1px solid var(--n-bd4); border-radius:7px;
    background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .m-refresh svg { width:13px; height:13px; fill:none; stroke:var(--n-tx2); stroke-width:1.4;
    stroke-linecap:round; stroke-linejoin:round; }
  .m-head .r2 { margin-top:11px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .m-head h1 { font-size:26px; line-height:1; letter-spacing:-.022em; font-weight:500; color:var(--n-tx); margin:0; }
  .m-head .meta { font-size:11px; color:var(--n-tx4); padding-bottom:2px; }

  /* Kickers + sections */
  .m-kick { font-size:9.5px; letter-spacing:.15em; color:var(--n-tx4); }
  .m-kick2 { font-size:9px; letter-spacing:.12em; color:var(--n-tx5); }
  .m-sec { padding:20px 18px 0; }
  .m-seclabel { padding:0 18px 9px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .m-seclabel .rt { font-size:10.5px; color:var(--n-tx5); }

  /* Date strip */
  .m-dates { display:flex; gap:6px; padding:4px 18px 12px; overflow-x:auto; scrollbar-width:none; }
  .m-dates::-webkit-scrollbar { width:0; height:0; }
  .m-date { min-width:42px; padding:6px 8px; border-radius:8px; text-align:center;
    border:1px solid var(--n-bd3); background:transparent; flex:none; }
  .m-date.on { border-color:var(--n-ac700); background:var(--n-ac900); }
  .m-date .dw { font-size:9px; letter-spacing:.09em; color:var(--n-tx4); }
  .m-date .dn { font-size:13px; margin-top:2px; color:var(--n-tx3); }
  .m-date.on .dn { color:var(--n-tx); }
  .m-date .dd { width:3px; height:3px; border-radius:50%; margin:4px auto 0; background:transparent; }
  .m-date .dd.today { background:var(--n-good); }
  .m-date .dd.alert { background:var(--n-ac); }
  .m-date.past { opacity:.45; }

  /* Sleep banner */
  .m-sleep { margin:0 18px 14px; padding:13px 14px; border-radius:10px;
    border:1px solid var(--n-bd4); background:var(--n-surf); }
  .m-sleep .hl { font-size:18px; margin-top:7px; letter-spacing:-.01em; }
  .m-sleep .sb { font-size:11.5px; color:var(--n-tx3); margin-top:4px; }

  /* Flagged card */
  .m-card { margin:0 18px 11px; padding:14px; border-radius:12px; border:1px solid var(--n-bd4);
    background:var(--n-surf); }
  .m-card.strong { border-color:var(--n-ac700);
    background:radial-gradient(130% 150% at 100% 0%,rgba(239,68,68,.13) 0%,rgba(255,255,255,.02) 55%,rgba(0,0,0,0) 100%);
    box-shadow:0 6px 24px rgba(93,82,148,.35); }
  .m-card .tier { font-size:9.5px; letter-spacing:.14em; color:var(--n-tx2); }
  .m-card.strong .tier { color:var(--n-ac300); }

  /* Track record */
  .m-hero { margin:2px 18px 0; padding:15px; border-radius:12px; border:1px solid var(--n-bd4);
    background:linear-gradient(160deg,rgba(255,255,255,.06) 0%,rgba(0,0,0,0) 100%); }

  .m-hero .side .b { font-size:11px; color:var(--n-tx4); }
  .m-unval { margin:14px 18px 0; padding:13px 14px; border-radius:10px;
    border:1px solid var(--n-ac800); background:var(--n-signal); }

  .m-bars { display:flex; align-items:flex-end; gap:7px; height:78px; margin-top:11px; }
  .m-bars .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .m-bars .bar { width:100%; border-radius:3px 3px 0 0; background:var(--n-bd4); }
  .m-bars .lb { font-size:9.5px; color:var(--n-tx4); margin-top:5px; }
  .m-rule { padding:10px 0; border-bottom:1px solid var(--n-bd); display:flex; gap:11px; align-items:flex-start; }
  .m-rule .d { width:5px; height:5px; border-radius:50%; margin-top:6px; flex:none; background:var(--n-ac700); }
  .m-rule .n { font-size:12.5px; color:var(--n-tx); }
  .m-rule .r { font-size:11px; color:var(--n-tx4); margin-top:2px; text-wrap:pretty; }
  .m-rule .p { font-size:9.5px; letter-spacing:.09em; color:var(--n-tx4); flex:none; margin-top:2px; }

  /* ---------- Game boxes (logo grid) ---------- */
  .m-boxes { display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:0 18px; }
  @media (min-width:520px) { .m-boxes { grid-template-columns:repeat(3,1fr); } }
  .m-box2 {
    /* Thin grey outline on near-black, generous rounding. The color in a box
       comes from the logo halos, not from the container. */
    border:1px solid #2a2a30; border-radius:14px;

<body>

<div class="amb" id="amb" aria-hidden="true"></div>

<div id="desk-root">
  <div class="masthead">
    <div>
      <h1>MLB Blowout Bot</h1>
      <div class="sub">Position-player concession signals &middot; live run-line ladders</div>
    </div>
    <div class="head-right" id="head-right"></div>
  </div>

  <div class="botstate" id="botstate" hidden></div>

  <div class="toolbar">
    <div class="pills" id="pills"></div>
    <div class="selwrap">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="lead">Biggest lead</option>
        <option value="relievers">Deepest bullpen</option>
        <option value="inning">Latest inning</option>
        <option value="name">Matchup</option>
      </select>
    </div>
  </div>

  <div class="section" style="margin-top:0">
    <div class="band"><span>Today's Slate</span><span class="band-note" id="slate-note"></span></div>
    <div class="boxed" id="slate"></div>
  </div>

  <div class="section" id="detail-wrap" hidden>
    <div class="band"><span>Game Detail</span><span class="band-note" id="detail-note"></span></div>
    <div class="boxed">
      <div id="matchup"></div>
      <div class="tabs" id="tabs"></div>
      <div id="tabbody"></div>
    </div>
  </div>

  <div class="section">
    <div class="band"><span>Alert History</span><span class="band-note" id="alert-note"></span></div>
    <div class="boxed" id="alerts"></div>
  </div>

  <div class="section">
    <div class="band"><span>Bot Status</span></div>
    <div class="boxed"><div class="stats" id="stats"></div></div>
  </div>
</div><!-- /desk-root -->

<div id="m-root" hidden>
  <div class="m-sweep" id="m-sweep" hidden></div>
  <div id="m-screen"></div>
  <nav class="m-tab" id="m-tab"></nav>
</div>

<script>
const REFRESH_MS = 15000;
const S = { games: [], status: null, filter: 'live', sort: 'lead', sel: null, tab: 'odds', pinned: false };

/* ---------- utils ---------- */
async function getJSON(p) {
  try { const r = await fetch(p + '?_=' + Date.now()); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function am(p) { return p == null ? '—' : (p > 0 ? '+' + p : '' + p); }
function pt(p) { return p == null ? '—' : (p > 0 ? '+' + p : '' + p); }
function ago(v) {
  if (v == null) return '—';
  const ms = typeof v === 'number' ? v * 1000 : Date.parse(v);
  if (!isFinite(ms)) return '—';
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  return h < 24 ? h + 'h ago' : Math.floor(h / 24) + 'd ago';
}
function clockLocal(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);

  return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

  if (!iso) return null;
  const t = Date.parse(iso);
  if (!isFinite(t)) return null;
  const s = Math.round((t - Date.now()) / 1000);
  if (s <= 0) return 'any moment';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? 'in ' + h + 'h ' + m + 'm' : 'in ' + m + 'm';
}
const lead = g => Math.abs((g.home_runs ?? 0) - (g.away_runs ?? 0));

}

  if (!g.inning) return 'Pre-game';
  const a = { Top: '▲', Bottom: '▼', Middle: '·', End: '·' }[g.inning_state] || '';
  return (a ? a + ' ' : '') + (g.inning_ordinal || g.inning);
}
function priority(g) {
  if (g.urgency) return 3;
  if (lead(g) >= 10) return 2;
  if (lead(g) >= 6) return 1;
  return 0;
}

/* ---------- filters / sort ---------- */
const FILTERS = [
  { id: 'live', label: 'Live', fn: g => !!g.is_live || g.status === 'Live' },
  { id: 'all', label: 'All', fn: () => true },
  { id: 'urgency', label: 'Urgency', fn: g => !!g.urgency },
  { id: 'blowout', label: 'Blowouts', fn: g => lead(g) >= 6 },
  { id: 'upcoming', label: 'Upcoming', fn: g => !(g.is_live || g.status === 'Live') && g.status !== 'Final' },
];
function renderPills() {
  const el = document.getElementById('pills');
  el.innerHTML = FILTERS.map(f => {
    const n = S.games.filter(f.fn).length;
    return '<button class="pill' + (S.filter === f.id ? ' active' : '') + '" data-f="' + f.id + '">'
      + esc(f.label) + '<span class="n">' + n + '</span></button>';
  }).join('');
  el.querySelectorAll('.pill').forEach(b => {
    b.onclick = () => { S.filter = b.dataset.f; renderPills(); renderSlate(); };
  });
}
function sortGames(list) {
  const c = [...list];
  c.sort((a, b) => {
    // Urgency and big leads always float, whatever the sort key.
    const p = priority(b) - priority(a);
    if (p) return p;
    if (S.sort === 'relievers') return trailRelievers(b) - trailRelievers(a);
    if (S.sort === 'inning') return (b.inning ?? 0) - (a.inning ?? 0);
    if (S.sort === 'name') return String(a.away_team).localeCompare(String(b.away_team));
    return lead(b) - lead(a);
  });
  return c;
}

/* ---------- slate ---------- */
function penDots(g) {
  const t = trailing(g), used = t ? relievers(g, t) : 0;
  let s = '';
  for (let i = 0; i < 6; i++) s += '<span class="pd' + (i < Math.min(used, 6) ? ' on' : '') + '"></span>';
  return '<span class="pen-dots" title="' + used + ' reliever(s) used by trailing team">' + s + '</span>';
}
function emptyMsg() {
  const st = S.status, sc = (st && st.schedule) || null;
  if (st && st.bot_state === 'sleeping') {
    if (sc && sc.games_today === 0) return 'Bot is sleeping — no MLB games scheduled today.';
    const w = sc && clockLocal(sc.next_wake), u = sc && untilText(sc.next_wake);
    if (w) return 'Bot is sleeping until first pitch at ' + w + (u ? ' (' + u + ')' : '') + '.';
    return 'Bot is sleeping until the next slate.';
  }
  return 'No live MLB games right now.';
}
function renderSlate() {
  const box = document.getElementById('slate');
  const f = FILTERS.find(x => x.id === S.filter) || FILTERS[0];
  const list = sortGames(S.games.filter(f.fn));
  document.getElementById('slate-note').textContent =
    S.games.length ? list.length + ' of ' + S.games.length + ' shown' : '';

  if (!list.length) {
    box.innerHTML = '<div class="empty">' + esc(emptyMsg()) + '</div>';
    S.sel = null;
    renderDetail();
    return;
  }
  // Auto-select the highest-priority game so the most important detail is
  // already on screen. A click pins the choice so refreshes stop moving it.
  if (!S.pinned || !list.some(g => String(g.game_pk) === String(S.sel))) {
    S.sel = list[0].game_pk;
  }
  box.innerHTML = list.map(g => {
    const a = g.away_runs ?? 0, h = g.home_runs ?? 0;
    const l = lead(g), t = trailing(g);
    const cls = g.urgency ? 'urgent' : (l >= 6 ? 'big' : '');
    const leadChip = l >= 10 ? 'hot' : (l >= 6 ? 'warm' : '');
    const gLive = !!g.is_live || g.status === 'Live';
    const gFinal = g.status === 'Final';
    const gUp = !gLive && !gFinal;
    return '<div class="slate-row ' + cls + (gUp ? ' upcoming' : '') + (String(g.game_pk) === String(S.sel) ? ' sel' : '') +
      '" data-pk="' + esc(g.game_pk) + '" tabindex="0" role="button">'
      + '<span class="flag"></span>'
      + '<span class="sr-teams">'
      +   '<span class="t' + (a < h ? ' dim' : '') + '">' + logoImg(g.away_id, 'sr-logo') + esc(g.away_team) + '</span>'
      +   '<span class="t' + (h < a ? ' dim' : '') + '">' + logoImg(g.home_id, 'sr-logo') + esc(g.home_team) + '</span>'
      + '</span>'
      + '<span class="sr-score">'
      +   (gUp ? '<span style="color:var(--muted-2)">—</span><br><span style="color:var(--muted-2)">—</span>'
            : '<span class="' + (a < h ? 'lose' : '') + '">' + a + '</span><br>'
              + '<span class="' + (h < a ? 'lose' : '') + '">' + h + '</span>')
      + '</span>'
      + '<span class="sr-inning">'
      +   esc(gUp ? (g.start_utc ? clockLocal(g.start_utc) || 'Sched' : 'Sched') : (gFinal ? 'Final' : inningTxt(g)))
      +   '<br><span style="color:var(--muted-2)">'
      +   esc(gUp ? 'first pitch' : (gFinal ? 'complete' : (g.outs ?? 0) + ' out')) + '</span></span>'
      + '<span class="sr-meta">'
      +   (gUp ? '<span class="chipnum">SCHEDULED</span>'
            : (l ? '<span class="chipnum ' + leadChip + '">LEAD ' + l + '</span>'
                 : '<span class="chipnum">TIED</span>'))
      +   (g.urgency ? '<span class="chipnum hot">URGENCY</span>' : '')
      +   (gUp ? '' : '<span class="chipnum">' + (t ? relievers(g, t) : 0) + ' REL</span>' + penDots(g))
      + '</span>'
      + '<span class="sr-inning" style="text-align:right">'
      +   (g.odds ? esc(g.odds.book_title || g.odds.book || '') : '<span style="color:var(--muted-2)">no odds</span>')
      + '</span>'
      + '</div>';
  }).join('');
  box.querySelectorAll('.slate-row').forEach(r => {
    const pick = () => { S.sel = r.dataset.pk; S.pinned = true; renderSlate(); };
    r.onclick = pick;
    r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  renderDetail();
}

/* ---------- detail ---------- */
const TABS = [
  { id: 'odds', label: 'Game Odds' },
  { id: 'ladder', label: 'Run Line Ladder' },
  { id: 'bullpen', label: 'Bullpens' },
  { id: 'state', label: 'Game State' },
];
function selected() { return S.games.find(g => String(g.game_pk) === String(S.sel)) || null; }

function cmpRow(aVal, label, bVal, aCls, bCls) {
  return '<div class="cmp">'
    + '<span class="v a ' + (aCls || '') + '">' + aVal + '</span>'
    + '<span class="lbl">' + esc(label) + '</span>'
    + '<span class="v b ' + (bCls || '') + '">' + bVal + '</span>'
    + '</div>';
}
function ladderFor(g, side) {
  const o = g.odds;
  if (!o) return [];
  const L = o['spreads_' + side] || [];
  if (!L.length) return [];
  const ml = o['moneyline_' + side];
  // Keep the side matching the moneyline sign (dog plays +, favorite plays -),
  // drop unbettable lock lines, sort by distance from pick'em, cap at 8.
  let f;
  if (ml != null) f = L.filter(x => ml > 0 ? x.point > 0 : x.point < 0);
  else {
    const p = L.filter(x => x.point > 0), n = L.filter(x => x.point < 0);
    f = p.length >= n.length ? p : n;
  }
  f = f.filter(x => x.price != null && x.price >= -600 && x.price <= 600);
  f.sort((x, y) => Math.abs(x.point) - Math.abs(y.point));
  return f.slice(0, 8);
}
function tabOdds(g) {

  const sa = (o.spreads_away || [])[0], sh = (o.spreads_home || [])[0];
  return cmpRow(
      sa ? pt(sa.point) + ' <span class="rk">' + am(sa.price) + '</span>' : '—',
      'Run line',
      sh ? pt(sh.point) + ' <span class="rk">' + am(sh.price) + '</span>' : '—')
    + cmpRow(am(o.moneyline_away), 'Moneyline', am(o.moneyline_home))
    + cmpRow(
      o.total_point != null ? 'O ' + o.total_point + ' <span class="rk">' + am(o.total_over_price) + '</span>' : '—',
      'Total',
      o.total_point != null ? 'U ' + o.total_point + ' <span class="rk">' + am(o.total_under_price) + '</span>' : '—')
    + cmpRow('<span style="font-size:11px">' + esc(o.book_title || o.book || '') + '</span>', 'Book',
             '<span style="font-size:11px">live</span>', 'dim', 'dim');
}
function tabLadder(g) {
  if (!g.odds) return '<div class="nodata" style="padding:16px">No odds posted for this matchup.</div>';
  const mk = side => {
    const rows = ladderFor(g, side);
    return '<div><div class="colhead"><span>' + esc(g[side + '_team']) + '</span>'
      + '<span class="tiny">' + (rows.length ? rows.length + ' rungs' : 'none') + '</span></div>'
      + (rows.length
          ? rows.map(r => '<div class="lrow"><span class="pt">' + pt(r.point) + '</span><span class="pr">' + am(r.price) + '</span></div>').join('')

function tabBullpen(g) {
  const mk = side => {

      + '<span class="tiny">' + p.length + ' used · ' + relievers(g, side) + ' rel</span></div>'
      + (p.length ? p.map((x, i) => {
          const st = [];

          return '<div class="brow' + (x.is_current ? ' cur' : '') + '">'
            + '<span class="i">' + (i + 1) + '</span>'
            + '<span class="nm">' + esc(x.name) + '</span>'

function tabState(g) {
  const a = g.away_runs ?? 0, h = g.home_runs ?? 0, l = lead(g), t = trailing(g);
  const ar = relievers(g, 'away'), hr = relievers(g, 'home');
  const ap = pen(g, 'away').reduce((s, x) => s + (x.pitches || 0), 0);
  const hp = pen(g, 'home').reduce((s, x) => s + (x.pitches || 0), 0);
  const cur = side => { const p = pen(g, side); return p.length ? p[p.length - 1] : null; };
  const ca = cur('away'), ch = cur('home');

    + cmpRow(t === 'away' ? l : '—', 'Trailing by', t === 'home' ? l : '—',
             t === 'away' ? (l >= 10 ? 'hot' : 'warm') : 'dim',
             t === 'home' ? (l >= 10 ? 'hot' : 'warm') : 'dim')
    + cmpRow(ar, 'Relievers used', hr, heat(ar), heat(hr))
    + cmpRow(ap || '—', 'Bullpen pitches', hp || '—', 'dim', 'dim')
    + cmpRow(ca ? esc(ca.name) : '—', 'On the mound', ch ? esc(ch.name) : '—')
    + cmpRow(ca && ca.pitches != null ? ca.pitches : '—', 'Pitch count',
             ch && ch.pitches != null ? ch.pitches : '—')
    + cmpRow(g.urgency && t === 'away' ? 'YES' : 'no', 'Urgency mode',
             g.urgency && t === 'home' ? 'YES' : 'no',

}
function renderDetail() {

    + '<div class="mt"><div class="name">' + esc(g.away_team) + '</div>'

  tabsEl.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { S.tab = b.dataset.t; renderDetail(); };

  const body = document.getElementById('tabbody');

/* ---------- bot state / header / alerts / footer ---------- */

document.getElementById('sort').onchange = e => { S.sort = e.target.value; renderSlate(); };

async function refresh(force) {
  if (force && typeof M !== 'undefined') {
    M.polling = true;
    const sw = document.getElementById('m-sweep');
    if (sw) { sw.hidden = false; sw.style.animation = 'none'; void sw.offsetWidth; sw.style.animation = ''; }
    renderMobile();
  }
  const [st, al, snap] = await Promise.all([
    getJSON('status.json'), getJSON('alerts_log.json'), getJSON('live_snapshot.json'),
  ]);
  S.games = (snap && snap.games) || [];
  S.status = st;
  // Desktop renderers
  renderHead(st);
  renderBotState(st);
  renderPills();
  renderSlate();
  renderAlerts(al);
  renderStats(st, snap);
  // Mobile state + renderer
  if (typeof M !== 'undefined') {
    M.alerts = Array.isArray(al) ? al : [];
    M.snap = snap;
    M.polling = false;
    const sw = document.getElementById('m-sweep');
    if (sw) sw.hidden = true;
    renderMobile();
  }
}
/* ==========================================================================
   MOBILE RENDERER — "Nocturne" handoff. Shares every fetch and helper above;
   only the DOM composition differs. Switches at 700px.
   ========================================================================== */
const MQ = window.matchMedia('(max-width: 700px)');
const M = {
  screen: 'slate', gameId: null, tab: 'overview', alertKey: null,
  filter: 'All', sort: 'Lead', tierFilter: 'All',
  polling: false, alerts: [], snap: null, outcomes: {},
};
const MINUS = '−';  // U+2212, not a hyphen — spec calls this out.

/* --- outcome persistence: localStorage is the "minimum viable fix" the

   because private windows and blocked site-data both throw on read. --- */
const OUT_KEY = 'bb_outcomes_v1';
function loadOutcomes() {
  try { return JSON.parse(localStorage.getItem(OUT_KEY) || '{}') || {}; }
  catch (e) { return {}; }
}
function saveOutcomes() {
  try { localStorage.setItem(OUT_KEY, JSON.stringify(M.outcomes)); } catch (e) {}
}
function alertKey(a) { return String(a.game_pk) + ':' + String(a.player_name) + ':' + String(a.timestamp); }

/* --- thresholds come from status.json so a Railway env change moves the UI --- */
function thr(k, d) {

}
function requiredDiff(inning) {
  const i = inning ?? 0;

function verdictOf(g) {
  const r = trailRelievers(g);

  if (g.urgency) return 'LEAN';

}
function readiness(g) {
  const req = requiredDiff(g.inning) || 1;

// Three MLB nicknames are two words. Taking only the last token turns

const TWO_WORD_NICKS = ['White Sox', 'Red Sox', 'Blue Jays'];

  const n = String(name || '').trim();
  if (!n) return '';
  const two = TWO_WORD_NICKS.find(t => n.endsWith(t));
  if (two) return two;
  const s = n.split(' ');
  return s.length > 1 ? s[s.length - 1] : s[0];
}
function commas(n) {

}

/* --- Screen: Slate --- */
function mDateStrip() {
  // Past dates need a GET /day/<date> that does not exist yet, so the strip
  // renders for orientation but only today is selectable. Faking history here
  // would be worse than omitting it.
  const today = new Date();
  let out = '<div class="m-dates">';
  for (let i = -4; i <= 2; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const isToday = i === 0;
    out += '<div class="m-date' + (isToday ? ' on' : ' past') + '"'
      + (isToday ? '' : ' title="Past slates need a history endpoint that does not exist yet"') + '>'
      + '<div class="dw">' + d.toLocaleDateString([], { weekday: 'short' }).toUpperCase() + '</div>'
      + '<div class="dn">' + d.getDate() + '</div>'
      + '<div class="dd' + (isToday ? ' today' : '') + '"></div></div>';
  }
  return out + '</div>';
}
function mSleepBanner() {
  const st = S.status;
  if (!st || !st.bot_state) return '';           // absent -> hide, never guess
  if (st.bot_state !== 'sleeping') return '';
  const sc = st.schedule || {};
  const until = untilText(sc.next_wake);
  const when = sc.next_wake ? new Date(Date.parse(sc.next_wake)) : null;
  const abs = when ? when.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
                     + ', ' + when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : null;
  return '<div class="m-sleep"><div class="m-kick">BOT ASLEEP &middot; BY DESIGN</div>'
    + '<div class="hl">' + esc(sc.games_today === 0 ? 'No games today' : (until ? 'Wakes ' + until.replace(/^in /, 'in ') : 'Waiting for the next slate')) + '</div>'
    + (abs ? '<div class="sb">' + esc(abs) + ' &middot; 5 min before first pitch</div>' : '')
    + '</div>';
}

function mFilterSort() {
  const chips = ['All', 'Urgency', 'Lead 6+'];
  return '<div class="m-chips">'
    + chips.map(c => '<button class="m-chip' + (M.filter === c ? ' on' : '') + '" data-mc="' + esc(c) + '">' + esc(c) + '</button>').join('')
    + '<button class="m-sort" id="m-sortbtn">'

    +   '<span>' + esc(M.sort) + '</span></button></div>';

function mFilterFn(g) {
  if (M.filter === 'Urgency') return !!g.urgency;

  return true;
}
function mSortGames(list) {
  const rank = { STRONG: 2, LEAN: 1, PASS: 0 };
  return [...list].sort((a, b) => {
    const v = rank[verdictOf(b)] - rank[verdictOf(a)];
    if (v) return v;
    if (M.sort === 'Inning') return (b.inning ?? 0) - (a.inning ?? 0);
    if (M.sort === 'Bullpen') return trailRelievers(b) - trailRelievers(a);
    return lead(b) - lead(a);

function screenSlate() {
  const st = S.status, sc = (st && st.schedule) || {};
  const all = S.games;
  const shown = mSortGames(all.filter(mFilterFn));
  // Only a live game can be flagged — a scheduled one has no bullpen state.
  const flagged = shown.filter(g => isLive(g) && verdictOf(g) !== 'PASS');
  const liveCount = all.filter(isLive).length;

  // mHeader escapes its meta, so use the literal character, not an entity.
  let out = mHeader('Today', liveCount + ' live · ' + all.length + ' today');
  out += mDateStrip();
  out += mSleepBanner();

  if (flagged.length) {
    out += '<div class="m-seclabel"><span class="m-kick">FLAGGED NOW &middot; ' + flagged.length + '</span>'
      + '<span class="rt">ranked by verdict</span></div>';
    out += flagged.map(mFlaggedCard).join('');
  }
  out += mFilterSort();
  if (!shown.length) {
    let a, b;
    if (all.length > 0) {
      a = 'Nothing matches that filter';
      b = 'Clear the filter to see the full slate.';
    } else if (sc.games_today > 0 && sc.games_final >= sc.games_today) {
      // Slate happened and finished — "no games scheduled" would be wrong.
      a = "Today's slate is complete";
      b = 'All ' + sc.games_today + ' games are final. The bot sleeps until the next first pitch.';
    } else if (sc.games_today > 0) {
      a = 'No games in progress';
      b = sc.games_today + ' scheduled today. Live cards appear once first pitch lands.';
    } else {
      a = 'No games scheduled';
      b = 'The bot sleeps through empty days and still writes its heartbeat every 60s.';
    }
    out += '<div class="m-empty"><div class="a">' + esc(a) + '</div><div class="b">' + esc(b) + '</div></div>';
  } else {
    // Logo boxes, split by state. Live first — that's where a signal can fire.
    const liveG = shown.filter(isLive);
    const upG = shown.filter(isUpcoming).sort((x, y) =>
      String(x.start_utc || '').localeCompare(String(y.start_utc || '')));
    const finG = shown.filter(isFinal);
    out += mBoxSection('LIVE NOW', liveG, 'tap for the full read');
    out += mBoxSection('UPCOMING', upG, upG.length ? 'first pitch, local' : '');
    out += mBoxSection('FINAL', finG);
  }
  // Stats footer — only the cells we actually have data for.
  const cells = [];
  if (sc.games_today != null) cells.push(['GAMES TODAY', sc.games_today]);
  if (sc.games_final != null) cells.push(['GAMES FINAL', sc.games_final]);
  if (sc.first_pitch) cells.push(['FIRST PITCH', clockLocal(sc.first_pitch) || '—']);
  const q = M.snap && M.snap.quota;
  if (q && q.remaining != null) cells.push(['ODDS QUOTA', commas(q.remaining) + ' left']);
  if (cells.length) {
    out += '<div class="m-statfoot"><div class="m-grid2">'
      + cells.map(c => '<div class="m-cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>').join('')
      + '</div></div>';
  }
  return out;
}

/* --- Screen: Live monitor --- */
function screenLive() {
  const st = S.status;
  // The snapshot now carries the whole slate; this screen is in-progress only.
  const live = S.games.filter(isLive).sort((a, b) => readiness(b) - readiness(a));
  let out = mHeader('Live monitor', live.length + ' in progress');
  out += '<div class="m-intro">Every live game, closest to firing first. One screen, no taps.</div>';
  if (!live.length) {
    out += '<div class="m-empty"><div class="a">Nothing live right now</div>'
      + '<div class="b">' + esc(emptyMsg()) + '</div></div>';
  }
  out += live.map(g => {
    const r = readiness(g), pctRaw = r * 100;
    const req = requiredDiff(g.inning), rel = trailRelievers(g), exh = thr('bullpen_exhaustion_count', 4);
    let cls = 'minus', fill = 'var(--n-bd4)';
    if (r > 0.95) { cls = 'best'; } else if (r > 0.6) { cls = ''; }
    let gate;
    if (r > 0.95) gate = 'armed — needs a position player';
    else if (lead(g) < req) gate = (req - lead(g)) + ' runs to the gate';
    else gate = Math.max(0, exh - rel) + ' arms to exhaustion';
    const fillCls = r > 0.95 ? 'm-fill best' : (r > 0.6 ? 'm-fill' : 'm-fill minus');
    return '<div class="m-mrow m-tap' + (r > 0.95 ? ' hot' : '') + '" data-mpk="' + esc(g.game_pk) + '" tabindex="0" role="button">'
      + '<div class="l1"><span class="mu">' + esc(g.away_team) + ' @ ' + esc(g.home_team) + '</span>'
      +   '<span class="sc' + (lead(g) >= 6 ? ' big' : '') + '">' + (g.away_runs ?? 0) + MINUS + (g.home_runs ?? 0) + '</span>'
      +   '<span class="inn">' + esc(inningTxt(g)) + '</span></div>'
      + '<div class="l2"><span class="m-track t4"><span class="' + fillCls + '" style="display:block;width:' + Math.min(100, pctRaw) + '%"></span></span>'
      +   '<span class="gate">' + esc(gate) + '</span></div>'
      + '</div>';
  }).join('');
  out += '<div class="m-panel"><div class="m-kick">POLL LOOP</div>'
    + '<div class="m-grid2" style="margin-top:10px">'
    + [['STATE', st ? (st.bot_state || '—') : '—'],
       ['INTERVAL', st ? st.poll_interval_seconds + 's' : '—'],
       ['LAST POLL', st ? ago(st.last_checked) : '—'],
       ['BOOK', (M.snap && M.snap.book) || '—']]
      .map(c => '<div class="m-cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>').join('')
    + '</div></div>';
  return out;
}

      }).join('') + '</div></div>';
  }
  out += '<div class="m-sec"><div class="m-kick">ACTIVE RULES</div><div style="margin-top:11px">'
    + rules.map((r, i) => '<div class="m-rule"><span class="d" style="background:' + ramp[Math.min(3, Math.floor(i / 2))] + '"></span>'
      + '<span style="flex:1;min-width:0"><div class="n">' + esc(r[0]) + '</div><div class="r">' + esc(r[1]) + '</div></span>'
      + '<span class="p">' + esc(r[2]) + '</span></div>').join('')
    + '</div></div>';
  return out;
}

/* --- tab bar + mount --- */
const NAVS = [
  ['slate', 'Slate', 'M3 5h14M3 10h14M3 15h9'],
  ['live', 'Live', 'M2 12l3.5-6 3 4 2.5-5 3 7 4-4'],
  ['alerts', 'Alerts', 'M10 3a4.6 4.6 0 0 0-4.6 4.6c0 3.6-1.6 4.7-1.6 4.7h12.4s-1.6-1.1-1.6-4.7A4.6 4.6 0 0 0 10 3zM8.3 15.4a1.9 1.9 0 0 0 3.4 0'],
  ['record', 'Record', 'M4 16V9m4 7V4m4 12v-5m4 5V7'],
];
/* The ambient field takes its hue from what the slate is doing, so the page
   itself reads hot when something is close to firing. Team colors of the most
   interesting game feed the third pool, which is what makes it feel tied to
   the actual games rather than being a fixed decoration. */
function updateAmbient() {
  const el = document.getElementById('amb');
  if (!el) return;
  const live = S.games.filter(isLive);
  const urgent = live.find(g => g.urgency);
  const biggest = live.slice().sort((a, b) => lead(b) - lead(a))[0];
  const focus = urgent || biggest || null;

  let a1, a2;
  if (urgent) {                       // something is latched — run hot
    a1 = 'rgba(239,68,68,.20)';
    a2 = 'rgba(251,191,36,.11)';
  } else if (biggest && lead(biggest) >= 6) {
    a1 = 'rgba(251,191,36,.15)';
    a2 = 'rgba(145,132,217,.09)';
  } else if (live.length) {
    a1 = 'rgba(120,110,190,.14)';
    a2 = 'rgba(60,140,190,.09)';
  } else {                            // asleep / empty slate — barely there
    a1 = 'rgba(120,120,150,.08)';
    a2 = 'rgba(80,90,130,.06)';
  }
  // Third pool picks up the focus game's trailing-team color.
  let a3 = 'rgba(90,90,150,.10)';
  if (focus) {
    const t = trailing(focus) || 'home';
    a3 = hexToRgba(teamColor(focus[t + '_id']), urgent ? 0.16 : 0.11);
  }
  el.style.setProperty('--amb1', a1);
  el.style.setProperty('--amb2', a2);
  el.style.setProperty('--amb3', a3);
}
function hexToRgba(hex, alpha) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || ''));
  if (!m) return 'rgba(120,120,150,' + alpha + ')';
  return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha + ')';
}

function renderMobile() {
  updateAmbient();
  if (!document.body.classList.contains('mobile')) return;
  const scr = document.getElementById('m-screen');
  const nav = document.getElementById('m-tab');
  const active = (M.screen === 'game') ? 'slate' : (M.screen === 'signal' ? 'alerts' : M.screen);

  if (M.screen === 'slate') scr.innerHTML = screenSlate();
  else if (M.screen === 'live') scr.innerHTML = screenLive();
  else if (M.screen === 'alerts') scr.innerHTML = screenAlerts();
  else if (M.screen === 'record') scr.innerHTML = screenRecord();
  else if (M.screen === 'game') scr.innerHTML = screenGame();
  else if (M.screen === 'signal') scr.innerHTML = screenSignal();

  nav.innerHTML = NAVS.map(n => '<button class="' + (active === n[0] ? 'on' : '') + '" data-nav="' + n[0] + '">'
    + svgIcon(n[2]) + '<span>' + esc(n[1]) + '</span></button>').join('');

  // wiring
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    M.screen = b.dataset.nav; M.gameId = null; M.alertKey = null; renderMobile();
    window.scrollTo(0, 0);
  });
  scr.querySelectorAll('[data-mpk]').forEach(el => {
    const go = () => { M.gameId = el.dataset.mpk; M.screen = 'game'; M.tab = 'overview'; renderMobile(); window.scrollTo(0, 0); };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  scr.querySelectorAll('[data-mak]').forEach(el => {
    const go = () => { M.alertKey = el.dataset.mak; M.screen = 'signal'; renderMobile(); window.scrollTo(0, 0); };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  scr.querySelectorAll('[data-mc]').forEach(b => b.onclick = () => { M.filter = b.dataset.mc; renderMobile(); });
  scr.querySelectorAll('[data-mtc]').forEach(b => b.onclick = () => { M.tierFilter = b.dataset.mtc; renderMobile(); });
  scr.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { M.tab = b.dataset.mt; renderMobile(); });
  scr.querySelectorAll('[data-moc]').forEach(b => b.onclick = () => {
    const cur = M.outcomes[M.alertKey];
    if (cur === b.dataset.moc) delete M.outcomes[M.alertKey]; else M.outcomes[M.alertKey] = b.dataset.moc;
    saveOutcomes(); renderMobile();
  });
  const sortBtn = document.getElementById('m-sortbtn');
  if (sortBtn) sortBtn.onclick = () => {
    const order = ['Lead', 'Inning', 'Bullpen'];
    M.sort = order[(order.indexOf(M.sort) + 1) % order.length];
    renderMobile();
  };
  const back = document.getElementById('m-back');
  if (back) back.onclick = () => {
    M.screen = (M.screen === 'signal') ? 'alerts' : 'slate';
    renderMobile(); window.scrollTo(0, 0);
  };
  const force = document.getElementById('m-force');
  if (force) force.onclick = () => refresh(true);
}

// Idempotent: only touches the DOM when the breakpoint actually crosses, so it
// is safe to call on a timer as well as on events.
let _lastMob = null;
function applyViewport() {
  const mob = MQ.matches;
  if (mob === _lastMob) return;
  _lastMob = mob;
  document.body.classList.toggle('mobile', mob);
  document.getElementById('m-root').hidden = !mob;
  document.getElementById('desk-root').hidden = mob;
  if (mob) renderMobile();
}
// matchMedia change is the right signal, but it does not fire reliably under
// devtools/CDP viewport emulation. window.resize always does, so listen to both
// and let applyViewport be idempotent.
if (MQ.addEventListener) MQ.addEventListener('change', applyViewport); else MQ.addListener(applyViewport);
window.addEventListener('resize', applyViewport);
window.addEventListener('orientationchange', applyViewport);

/* Freshness ticks every second — stale data on a betting dashboard is worse
   than no data, so the age display must never go quiet. But a full re-render
   at 1Hz would tear down and rebuild every <img> on the screen once a second,
   which flickers the logos on a real device. So the tick patches only the
   text that actually changes; full re-renders stay on the 15s data refresh
   and on user interaction. */
function tickFreshness() {
  const st = S.status;
  const el = document.querySelector('#m-screen .m-fresh');
  if (el && st) {
    const sleeping = st.bot_state === 'sleeping';
    let txt, stale = false;
    if (M.polling) txt = 'polling…';
    else if (sleeping) txt = 'asleep';
    else {
      const secs = Math.max(0, Math.round((Date.now() - Date.parse(st.last_checked)) / 1000));
      txt = secs + 's ago';
      stale = secs > 25;
    }
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('stale', stale);
  }
  // Sleep-banner countdown is the other per-second value.
  const hl = document.querySelector('#m-screen .m-sleep .hl');
  if (hl && st && st.schedule && st.schedule.next_wake) {
    const u = untilText(st.schedule.next_wake);
    const txt = st.schedule.games_today === 0 ? 'No games today' : (u ? 'Wakes ' + u : 'Waiting for the next slate');
    if (hl.textContent !== txt) hl.textContent = txt;
  }
}
setInterval(() => {
  applyViewport();
  if (document.body.classList.contains('mobile')) tickFreshness();
}, 1000);

M.outcomes = loadOutcomes();
applyViewport();

refresh();
setInterval(refresh, REFRESH_MS);
</script>
