<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Blowout Bot</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b2030;
    --border: #262b36;
    --border-strong: #333947;
    --text: #eef1f7;
    --muted: #8b93a7;
    --muted-strong: #b0b8cc;
    --accent: #f2a71b;
    --good: #2fbf71;
    --bad: #e6584f;
    --winner: #2fbf71;
    --loser: #e6584f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
    max-width: 960px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Hero */
  .hero {
    text-align: center;
    padding: 40px 20px 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .hero h1 {
    font-size: 44px;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), #ff6a3d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero .tagline {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  h2 {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 32px 0 12px;
    font-weight: 600;
  }

  /* Bot state banner */
  .bot-state {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .bot-state[hidden] { display: none; }
  .bot-state.scanning { border-left: 3px solid var(--good); }
  .bot-state.sleeping { border-left: 3px solid var(--accent); }
  .bot-state .state-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .bot-state.scanning .state-label { color: var(--good); }
  .bot-state.sleeping .state-label { color: var(--accent); }
  .bot-state .state-detail {
    font-size: 13px;
    color: var(--muted-strong);
  }
  .bot-state .state-detail b { color: var(--text); font-weight: 600; }

  /* Game cards */
  .games { display: flex; flex-direction: column; gap: 16px; }
  .game-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .matchup {
    font-size: 18px;
    font-weight: 600;
  }
  .matchup .away { color: var(--muted-strong); }
  .matchup .at { color: var(--muted); margin: 0 6px; font-size: 14px; }
  .matchup .home { }

  .score {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-align: right;
  }
  .score .winner-score { color: var(--winner); }
  .score .loser-score { color: var(--loser); }
  .score .sep { color: var(--muted); margin: 0 6px; font-weight: 400; }

  .game-state {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    align-items: center;
  }
  .state-pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--muted-strong);
    font-weight: 500;
  }
  .state-pill b { color: var(--text); font-weight: 600; }

  /* Two-column bet section */
  .bets-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .team-col {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .team-col.winner { border-left: 3px solid var(--winner); }
  .team-col.loser { border-left: 3px solid var(--loser); }
  .team-col .team-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .team-col .team-tag {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .ladder-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 6px 0 4px;
  }
  .ladder-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
    font-variant-numeric: tabular-nums;
  }
  .ladder-row .point { color: var(--text); font-weight: 500; }
  .ladder-row .price { color: var(--muted-strong); }

  .ml-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0 2px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .ml-line .price { color: var(--muted-strong); }

  .total-line {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted-strong);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .total-line b { color: var(--text); }
  .total-line .over-under {
    display: flex;
    gap: 12px;
    font-variant-numeric: tabular-nums;
  }

  .book-tag {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 8px;
  }

  .no-odds {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    padding: 4px 0;
  }

  /* Urgency mode */
  .game-card.urgency {
    border-color: var(--bad);
    box-shadow: 0 0 0 1px rgba(230, 88, 79, 0.35);
  }
  .urgency-badge {
    display: inline-block;
    background: rgba(230, 88, 79, 0.15);
    color: var(--bad);
    border: 1px solid rgba(230, 88, 79, 0.4);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Bullpen strip */
  .bullpen-block {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .bullpen-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .bullpen-col {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .bullpen-col .bp-team {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .bp-row {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 8px;
    align-items: baseline;
    font-size: 12px;
    padding: 3px 0;
    font-variant-numeric: tabular-nums;
  }
  .bp-row .bp-idx {
    color: var(--muted);
    font-size: 10px;
    text-align: right;
  }
  .bp-row .bp-name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bp-row .bp-stats {
    color: var(--muted-strong);
    font-size: 11px;
    white-space: nowrap;
  }
  .bp-row.bp-current .bp-name { color: var(--accent); font-weight: 600; }
  .bp-row.bp-current .bp-name::after {
    content: " ●";
    color: var(--good);
    font-size: 10px;
  }
  .bp-empty {
    color: var(--muted);
    font-size: 11px;
    font-style: italic;
  }

  /* Alert history */
  .alert-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .alert-card .top-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .alert-card .matchup-small {
    font-weight: 600;
    font-size: 14px;
  }
  .alert-card .time {
    color: var(--muted);
    font-size: 11px;
  }
  .alert-card .detail {
    color: var(--muted-strong);
    font-size: 12px;
    line-height: 1.5;
  }
  .alert-card .detail b { color: var(--text); }
  .bet-tag {
    display: inline-block;
    background: rgba(242, 167, 27, 0.15);
    color: var(--accent);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    margin-top: 8px;
  }
  .alert-odds {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .alert-odds b { color: var(--text); }

  /* Footer bot status */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .footer-cards {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .status-card .label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .status-card .value {
    font-size: 15px;
    font-weight: 600;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.live { background: var(--good); }
  .dot.stale { background: var(--bad); }
  .dot.sleep { background: var(--accent); }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 24px;
    text-align: center;
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>MLB Blowout Bot</h1>
    <div class="tagline">Position-player-pitching detection &middot; run-line ladder plays &middot; live edge signals</div>
  </div>

  <div id="bot-state" class="bot-state" hidden></div>

  <h2>Live Games</h2>
  <div id="games" class="games"></div>

  <h2>Alert History</h2>
  <div id="alerts"></div>

  <div class="footer">
    <div class="footer-cards" id="footer-cards"></div>
  </div>

<script>
const REFRESH_MS = 15000;

async function fetchJson(path) {
  try {
    const res = await fetch(path + '?_=' + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - (typeof iso === 'number' ? iso * 1000 : new Date(iso).getTime());
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Schedule times arrive as ISO strings (UTC) and are rendered in the viewer's
// own timezone. Every field may be missing or null on older status.json files,
// so each helper returns '' rather than throwing on bad input.
function localTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function localDayTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const t = localTime(iso);
  if (d.toDateString() === new Date().toDateString()) return t;
  return `${d.toLocaleDateString([], { weekday: 'short' })} ${t}`;
}

function countdown(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const diff = t - Date.now();
  if (diff <= 0) return 'any moment now';
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'in under a minute';
  if (m < 60) return `in ${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return m % 60 ? `in ${h}h ${m % 60}m` : `in ${h}h`;
  return h % 24 ? `in ${Math.floor(h / 24)}d ${h % 24}h` : `in ${Math.floor(h / 24)}d`;
}

function american(p) {
  if (p == null) return '';
  return p > 0 ? `+${p}` : `${p}`;
}

function spreadPt(p) {
  if (p == null) return '';
  return p > 0 ? `+${p}` : `${p}`;
}

function renderInningPill(g) {
  if (!g.inning) return '';
  const halfMap = { Top: '▲', Bottom: '▼', Middle: '·', End: '·' };
  const arrow = halfMap[g.inning_state] || '·';
  return `<span class="state-pill"><b>${arrow} ${esc(g.inning_ordinal || g.inning)}</b></span>`;
}

function renderCountPill(g) {
  if (g.balls == null && g.strikes == null && g.outs == null) return '';
  return `<span class="state-pill"><b>${g.balls ?? 0}-${g.strikes ?? 0}</b> count &middot; <b>${g.outs ?? 0}</b> out${(g.outs ?? 0) === 1 ? '' : 's'}</span>`;
}

function renderGameCard(g) {
  const awayWin = (g.away_runs ?? 0) > (g.home_runs ?? 0);
  const homeWin = (g.home_runs ?? 0) > (g.away_runs ?? 0);
  const awayCls = awayWin ? 'winner-score' : (homeWin ? 'loser-score' : '');
  const homeCls = homeWin ? 'winner-score' : (awayWin ? 'loser-score' : '');

  return `
    <div class="game-card${g.urgency ? ' urgency' : ''}">
      <div class="game-header">
        <div class="matchup">
          <span class="away">${esc(g.away_team)}</span>
          <span class="at">@</span>
          <span class="home">${esc(g.home_team)}</span>
        </div>
        <div class="score">
          <span class="${awayCls}">${g.away_runs ?? 0}</span>
          <span class="sep">-</span>
          <span class="${homeCls}">${g.home_runs ?? 0}</span>
        </div>
      </div>

      <div class="game-state">
        ${g.urgency ? '<span class="urgency-badge">Urgency Mode</span>' : ''}
        ${renderInningPill(g)}
        ${renderCountPill(g)}
      </div>

      ${renderBets(g)}
      ${renderBullpens(g)}
    </div>
  `;
}

function renderBullpens(g) {
  const away = g.away_bullpen || [];
  const home = g.home_bullpen || [];
  if (!away.length && !home.length) return '';
  return `
    <div class="bullpen-block">
      <div class="bullpen-grid">
        ${renderBullpenCol(g.away_team, away)}
        ${renderBullpenCol(g.home_team, home)}
      </div>
    </div>
  `;
}

function renderBullpenCol(team, pen) {
  if (!pen || !pen.length) {
    return `
      <div class="bullpen-col">
        <div class="bp-team">${esc(team)} bullpen</div>
        <div class="bp-empty">No pitchers logged yet.</div>
      </div>
    `;
  }
  const rows = pen.map((p, i) => {
    const stats = [];
    if (p.innings_pitched != null) stats.push(`${p.innings_pitched} IP`);
    if (p.pitches != null) stats.push(`${p.pitches}p`);
    const rowCls = p.is_current ? 'bp-row bp-current' : 'bp-row';
    return `
      <div class="${rowCls}">
        <span class="bp-idx">${i + 1}.</span>
        <span class="bp-name">${esc(p.name)}</span>
        <span class="bp-stats">${stats.join(' · ') || '—'}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="bullpen-col">
      <div class="bp-team">${esc(team)} bullpen (${pen.length})</div>
      ${rows}
    </div>
  `;
}

function renderBets(g) {
  const o = g.odds;
  if (!o) {
    return `<div class="no-odds">Odds not available for this matchup (book may not offer, or snapshot refresh pending).</div>`;
  }

  const homeIsWinner = (g.home_runs ?? 0) > (g.away_runs ?? 0);
  const awayIsWinner = (g.away_runs ?? 0) > (g.home_runs ?? 0);

  const leftIsWinner = homeIsWinner || (!awayIsWinner);
  const leftSide = leftIsWinner ? 'home' : 'away';
  const rightSide = leftIsWinner ? 'away' : 'home';

  const leftTeam = leftSide === 'home' ? o.home_team : o.away_team;
  const rightTeam = rightSide === 'home' ? o.home_team : o.away_team;
  const leftLadder = o[`spreads_${leftSide}`] || [];
  const rightLadder = o[`spreads_${rightSide}`] || [];
  const leftML = o[`moneyline_${leftSide}`];
  const rightML = o[`moneyline_${rightSide}`];

  const leftTag = homeIsWinner === (leftSide === 'home') && (homeIsWinner || awayIsWinner) ? 'Leading' : (leftSide === 'home' ? 'Home' : 'Away');
  const rightTag = homeIsWinner === (rightSide === 'home') && (homeIsWinner || awayIsWinner) ? 'Leading' : (rightSide === 'home' ? 'Home' : 'Away');
  const leftIsWinnerReal = (leftSide === 'home' && homeIsWinner) || (leftSide === 'away' && awayIsWinner);
  const rightIsWinnerReal = (rightSide === 'home' && homeIsWinner) || (rightSide === 'away' && awayIsWinner);

  const total = o.total_point;
  const totalBlock = total != null ? `
    <div class="total-line">
      <span>Total: <b>${total}</b></span>
      <span class="over-under">
        <span>Over ${american(o.total_over_price)}</span>
        <span>Under ${american(o.total_under_price)}</span>
      </span>
    </div>
  ` : '';

  return `
    <div class="bets-grid">
      ${renderTeamCol(leftTeam, leftTag, leftIsWinnerReal, leftLadder, leftML)}
      ${renderTeamCol(rightTeam, rightTag, rightIsWinnerReal, rightLadder, rightML)}
    </div>
    ${totalBlock}
    <div class="book-tag">Lines from ${esc(o.book_title || o.book || '')}</div>
  `;
}

function filterLadder(ladder, ml) {
  if (!ladder || !ladder.length) return [];
  // Pick the ladder side matching the moneyline sign: dog (+ML) plays +spreads,
  // favorite (-ML) plays -spreads. Fall back to whichever side is more populated.
  let filtered;
  if (ml != null) {
    filtered = ladder.filter(l => (ml > 0 ? l.point > 0 : l.point < 0));
  } else {
    const pos = ladder.filter(l => l.point > 0);
    const neg = ladder.filter(l => l.point < 0);
    filtered = pos.length >= neg.length ? pos : neg;
  }
  // Drop unrealistic prices (anything worse than -600 or better than +600 is
  // not a real ladder play — those are lock/no-shot lines).
  filtered = filtered.filter(l => l.price != null && l.price >= -600 && l.price <= 600);
  filtered.sort((a, b) => Math.abs(a.point) - Math.abs(b.point));
  return filtered.slice(0, 8);
}

function renderTeamCol(name, tag, isWinner, ladder, ml) {
  const cls = isWinner ? 'winner' : (tag === 'Leading' ? 'loser' : '');
  const trimmed = filterLadder(ladder, ml);
  const ladderRows = trimmed.length ? trimmed.map(l => `
    <div class="ladder-row">
      <span class="point">${spreadPt(l.point)}</span>
      <span class="price">${american(l.price)}</span>
    </div>
  `).join('') : `<div class="no-odds">No run-line ladder</div>`;
  const mlRow = ml != null ? `
    <div class="ml-line">
      <span>Moneyline</span>
      <span class="price">${american(ml)}</span>
    </div>` : '';
  return `
    <div class="team-col ${cls}">
      <div class="team-name">${esc(name)}</div>
      <div class="team-tag">${tag}</div>
      <div class="ladder-label">Run Line Ladder</div>
      ${ladderRows}
      ${mlRow}
    </div>
  `;
}

function gameLead(g) {
  return Math.abs((g.home_runs ?? 0) - (g.away_runs ?? 0));
}

// The bot only runs during MLB game windows, so an idle dashboard is normal
// overnight. This banner is the difference between "asleep on purpose" and
// "crashed". If status.json predates the schedule fields we hide it entirely
// rather than guess at a state.
function renderBotState(status) {
  const el = document.getElementById('bot-state');
  const state = status && status.bot_state;
  if (state !== 'scanning' && state !== 'sleeping') {
    el.hidden = true;
    el.className = 'bot-state';
    el.innerHTML = '';
    return;
  }

  const sched = (status && status.schedule) || {};
  const games = sched.games_today;
  const finals = sched.games_final;
  const pills = [];
  let detail = '';

  if (state === 'scanning') {
    const bits = [];
    if (games != null) bits.push(`<b>${esc(games)}</b> game${Number(games) === 1 ? '' : 's'} today`);
    if (finals != null) bits.push(`<b>${esc(finals)}</b> final`);
    if (bits.length) detail = `&mdash; ${bits.join(', ')}`;
  } else {
    const wakeAt = localDayTime(sched.next_wake);
    const cd = countdown(sched.next_wake);
    if (wakeAt) {
      detail = 'until first pitch';
      if (cd) pills.push(`<span class="state-pill"><b>${esc(cd)}</b></span>`);
      pills.push(`<span class="state-pill">wakes <b>${esc(wakeAt)}</b></span>`);
    } else if (games === 0) {
      detail = '&mdash; no MLB games scheduled today';
    } else {
      detail = '&mdash; next wake time not published yet';
    }
  }

  el.hidden = false;
  el.className = `bot-state ${state}`;
  el.innerHTML = `
    <span class="dot ${state === 'scanning' ? 'live' : 'sleep'}"></span>
    <span class="state-label">${state === 'scanning' ? 'Scanning' : 'Sleeping'}</span>
    ${detail ? `<span class="state-detail">${detail}</span>` : ''}
    ${pills.join('')}
  `;
}

function emptyGamesMessage(status) {
  const fallback = 'No live MLB games right now. Cards will appear here automatically once games are in progress.';
  if (!status || status.bot_state !== 'sleeping') return fallback;
  const sched = status.schedule || {};
  const wakeAt = localDayTime(sched.next_wake);
  if (wakeAt) {
    const cd = countdown(sched.next_wake);
    return `Bot is sleeping until first pitch at ${esc(wakeAt)}${cd ? ` (${esc(cd)})` : ''}.`;
  }
  if (sched.games_today === 0) return 'Bot is sleeping &mdash; no MLB games scheduled today.';
  return 'Bot is sleeping until the next game window.';
}

function renderGames(snapshot, status) {
  const container = document.getElementById('games');
  if (!snapshot || !snapshot.games || snapshot.games.length === 0) {
    container.innerHTML = `<div class="empty">${emptyGamesMessage(status)}</div>`;
    return;
  }
  // Urgency-mode games pinned to the top, then biggest lead first. Re-sorted
  // every refresh so the column re-orders itself as scores change instead of
  // staying pinned to first-fetch order.
  const sorted = [...snapshot.games].sort((a, b) =>
    (b.urgency ? 1 : 0) - (a.urgency ? 1 : 0) || gameLead(b) - gameLead(a)
  );
  container.innerHTML = sorted.map(renderGameCard).join('');
}

function renderAlerts(alerts) {
  const container = document.getElementById('alerts');
  if (!alerts || alerts.length === 0) {
    container.innerHTML = '<div class="empty">No blowout scenarios detected yet. This is a rare event — will populate automatically when one hits.</div>';
    return;
  }
  const sorted = [...alerts].reverse();
  container.innerHTML = sorted.map(a => {
    const o = a.odds_at_alert;
    let oddsBlock = '';
    if (o) {
      const betSide = a.bet_team === o.home_team ? 'home' : 'away';
      const s = o[`spread_${betSide}`];
      const sp = o[`spread_${betSide}_price`];
      const ml = o[`ml_${betSide}`] ?? o[`moneyline_${betSide}`];
      if (s != null) {
        oddsBlock = `
          <div class="alert-odds">
            Line at alert (${esc(o.book_title || o.book || '')}): <b>${esc(a.bet_team)} ${spreadPt(s)}</b> (${american(sp)})${ml != null ? ` &middot; ML ${american(ml)}` : ''}
          </div>`;
      }
    }
    return `
      <div class="alert-card">
        <div class="top-line">
          <div class="matchup-small">${esc(a.bet_team)} ${a.bet_team_runs} &ndash; ${a.conceding_team_runs} ${esc(a.conceding_team)}</div>
          <div class="time">${timeAgo(a.timestamp)}</div>
        </div>
        <div class="detail">
          <b>${esc(a.player_name)}</b> (${esc(a.player_position)}) pitched for ${esc(a.conceding_team)}, down ${a.run_diff} runs.
        </div>
        <div class="bet-tag">Bet: ${esc(a.bet_team)} spread to increase</div>
        ${oddsBlock}
      </div>
    `;
  }).join('');
}

function renderFooter(status, snapshot) {
  const el = document.getElementById('footer-cards');
  const isLive = status && (Date.now() - new Date(status.last_checked).getTime()) < (status.poll_interval_seconds + 60) * 1000;
  const quota = snapshot && snapshot.quota;
  const snapshotAge = snapshot && snapshot.fetched_at ? timeAgo(snapshot.fetched_at) : '—';
  // A sleeping bot has an intentionally old last_checked, so don't call it stale.
  const sleeping = status && status.bot_state === 'sleeping';
  const sched = (status && status.schedule) || {};
  const firstPitch = localDayTime(sched.first_pitch);

  el.innerHTML = `
    <div class="status-card">
      <div class="label">Bot Status</div>
      <div class="value"><span class="dot ${sleeping ? 'sleep' : (isLive ? 'live' : 'stale')}"></span>${sleeping ? 'Sleeping' : (isLive ? 'Running' : 'Stale')}</div>
    </div>
    <div class="status-card">
      <div class="label">Live Games</div>
      <div class="value">${status ? status.live_games : '—'}</div>
    </div>
    <div class="status-card">
      <div class="label">Threshold</div>
      <div class="value">${status ? status.blowout_run_diff + '+ runs' : '—'}</div>
    </div>
    <div class="status-card">
      <div class="label">Last Poll</div>
      <div class="value">${status ? timeAgo(status.last_checked) : '—'}</div>
    </div>
    <div class="status-card">
      <div class="label">Odds Snapshot</div>
      <div class="value">${snapshotAge}</div>
    </div>
    ${sched.games_today != null ? `
    <div class="status-card">
      <div class="label">Games Today</div>
      <div class="value">${esc(sched.games_today)}</div>
    </div>` : ''}
    ${sched.games_final != null ? `
    <div class="status-card">
      <div class="label">Games Final</div>
      <div class="value">${esc(sched.games_final)}</div>
    </div>` : ''}
    ${firstPitch ? `
    <div class="status-card">
      <div class="label">First Pitch</div>
      <div class="value">${esc(firstPitch)}</div>
    </div>` : ''}
    ${quota && quota.remaining != null ? `
    <div class="status-card">
      <div class="label">Odds API Left</div>
      <div class="value">${esc(quota.remaining)}</div>
    </div>` : ''}
  `;
}

async function refresh() {
  const [status, alerts, snapshot] = await Promise.all([
    fetchJson('status.json'),
    fetchJson('alerts_log.json'),
    fetchJson('live_snapshot.json'),
  ]);
  renderBotState(status);
  renderGames(snapshot, status);
  renderAlerts(alerts);
  renderFooter(status, snapshot);
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
